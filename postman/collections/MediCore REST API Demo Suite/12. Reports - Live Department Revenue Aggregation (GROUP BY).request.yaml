$kind: http-request
url: "{{base_url}}/api/reports/revenue"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Returns live financial totals and department array', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property('department_breakdown');
          pm.expect(jsonData).to.have.property('hospital_totals');
          pm.expect(jsonData.department_breakdown).to.be.an('array');
      });
    language: text/javascript
order: 12000
